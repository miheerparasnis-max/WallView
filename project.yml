name: WallView
options:
  bundleIdPrefix: com.wallview
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  WallView:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WallView
    info:
      path: WallView/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "WallView uses your camera to detect walls and preview how a painting will look in your space using augmented reality."
        NSPhotoLibraryUsageDescription: "WallView needs access to your photo library so you can choose a photo of a painting or artwork to preview on your wall."
        NSPhotoLibraryAddUsageDescription: "WallView saves your AR wall previews to your photo library so you can keep or share them."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallview.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
